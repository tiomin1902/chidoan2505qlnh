<style>
:root {
  --navy:#162e4f;
  --blue:#185a99;
  --gold:#c7a46a;
  --bg:#f4f7fb;
  --white:#fff;
  --line:#e0e9f3;
  --text:#1b314c;
  --muted:#63758c;
  --red:#b33b50;
  font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:
    radial-gradient(circle at top right,#e9f2fe,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;
}

button,input,textarea,select {font:inherit}

button {
  cursor:pointer;
  background:linear-gradient(140deg,#185a99,#244c83);
  color:white;
  border:0;
  border-radius:11px;
  padding:11px 17px;
  font-weight:650;
  min-height:41px;
  transition:.2s ease;
}

button:hover:not(:disabled) {
  transform:translateY(-1px);
  box-shadow:0 8px 19px #1a527423;
}

button:disabled {opacity:.5;cursor:not-allowed}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline:3px solid var(--gold);
  outline-offset:2px;
}

input,textarea,select {
  width:100%;
  max-width:100%;
  min-height:45px;
  padding:12px 14px;
  border:1px solid #cfdae7;
  border-radius:11px;
  background:#fcfdff;
  font-size:14px;
}

input:focus,textarea:focus,select:focus {
  border-color:#6396c7;
  box-shadow:0 0 0 4px #5897d022;
  outline:0;
}

label {
  display:grid;
  gap:9px;
  color:#385474;
  font-size:13px;
  font-weight:650;
  line-height:1.4;
}

h1 {font-size:27px}
h2 {font-size:22px}

/* ĐĂNG NHẬP */

#login {
  max-width:410px;
  margin:9vh auto;
  padding:36px;
  background:white;
  border:1px solid #dce8f4;
  border-radius:25px;
  box-shadow:0 32px 85px #112f4a27;
}

#login h1 {
  color:#173c63;
  text-align:center;
}

#login p {text-align:center;color:var(--muted)}

#login form {
  display:grid;
  gap:18px;
  margin-top:25px;
}

#app {display:none}

/* THANH TRÊN */

header {
  background:linear-gradient(115deg,#102c4b,#1d4f7b);
  color:white;
  min-height:80px;
  padding:18px clamp(16px,3vw,38px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:3px solid var(--gold);
  box-shadow:0 12px 32px #1b3b5a1b;
}

header strong {letter-spacing:.045em}

.secondary {
  background:#e8f1fb;
  color:#234d7b;
}

.danger {
  background:#b33b50;
  color:white;
}

/* BỐ CỤC */

.layout {
  display:flex;
  min-height:calc(100vh - 80px);
}

aside {
  width:260px;
  flex-shrink:0;
  position:sticky;
  top:0;
  max-height:calc(100vh - 80px);
  overflow:auto;
  background:linear-gradient(180deg,#fff,#f9fbfe);
  padding:25px 15px;
  display:grid;
  align-content:start;
  gap:7px;
  border-right:1px solid #e0e8f3;
  box-shadow:8px 0 28px #315b7d08;
}

aside button {
  display:flex;
  align-items:center;
  min-height:49px;
  border:1px solid transparent;
  border-radius:13px;
  padding:12px 17px;
  font-size:14px;
  line-height:1.4;
  font-weight:650;
  color:#385675;
  background:transparent;
  text-align:left;
  box-shadow:none;
}

aside button::before {
  content:"•";
  color:#9aafc5;
  font-size:18px;
  margin-right:11px;
}

aside button:hover {
  background:#eef5fd;
}

aside button.active {
  background:linear-gradient(110deg,#e6f0fc,#f1f7ff);
  border-color:#cbdff2;
  color:#16477c;
  box-shadow:inset 3px 0 0 #c29e67;
}

aside button.active::before {color:#bb8e50}

main {
  flex:1;
  min-width:0;
  padding:clamp(16px,2.8vw,38px);
  max-width:1650px;
}

#heading {
  color:#153a62;
  font-size:clamp(25px,2.4vw,34px);
  letter-spacing:-.025em;
  margin:0 0 24px;
}

/* THẺ QUẢN TRỊ */

.panel {
  background:white;
  border:1px solid #e0e9f3;
  border-radius:21px;
  padding:clamp(18px,2.6vw,32px);
  box-shadow:0 16px 45px #28445d0d;
  margin-bottom:24px;
}

.panel h2 {
  color:#183e69;
  font-size:clamp(20px,2vw,25px);
  margin:0 0 20px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
}

/* BIỂU MẪU: MỖI TRƯỜNG MỘT HÀNG */

#content .panel form .grid {
  grid-template-columns:minmax(0,1fr);
  max-width:100%;
  gap:16px;
}

#content .panel form .grid > label {
  width:100%;
  min-width:0;
}

/* THỐNG KÊ */

.metric {
  font-size:clamp(29px,3vw,42px);
  font-weight:bold;
  color:#1f5387;
}

.panel .grid > div:has(.metric) {
  padding:21px 24px;
  background:linear-gradient(130deg,#f6faff,#fff);
  border:1px solid #dce8f5;
  border-radius:17px;
}

.panel .grid > div:has(.metric) p {
  margin:0 0 12px;
  color:#61758d;
  font-weight:650;
}

/* BẢNG */

.scroll {
  overflow:auto;
  max-width:100%;
  border:1px solid #e1e8f0;
  border-radius:15px;
}

table {
  min-width:860px;
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}

th,td {
  text-align:left;
  vertical-align:top;
  padding:14px 13px;
  border-bottom:1px solid #e9eef5;
  overflow-wrap:anywhere;
}

th {
  background:#edf4fc;
  color:#2e5680;
  font-size:12px;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:1;
  line-height:1.5;
}

td {line-height:1.55}

tbody tr:nth-child(even) {background:#fafcff}
tbody tr:hover {background:#eff6fd}

.rowactions {
  min-width:128px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.rowactions button {
  padding:8px 11px;
  min-height:35px;
}

.toggle {
  display:flex;
  align-items:center;
  gap:14px;
  background:#f8fbff;
  border:1px solid #e1eaf5;
  border-radius:12px;
  padding:12px 15px;
}

.toggle input {
  width:22px;
  min-height:0;
  height:22px;
  accent-color:#235d92;
}

.muted {color:var(--muted);font-size:13px}
.status {color:#ad3444;min-height:24px;line-height:1.5}

.attendanceForm {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
  max-width:960px;
}

.attendanceForm > .muted,
.attendanceForm > button {
  grid-column:1/-1;
}

.attendanceActions {
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between;
  border:1px solid #e2e9f1;
  padding:13px;
  border-radius:13px;
  margin-top:12px;
  flex-wrap:wrap;
}

.attendanceActions strong {flex:1}

/* ĐIỆN THOẠI */

@media(max-width:850px) {
  .layout {display:block}

  aside {
    position:static;
    width:100%;
    max-height:none;
    display:flex;
    gap:8px;
    overflow-x:auto;
    white-space:nowrap;
    padding:12px;
  }

  aside button {
    flex:none;
    min-height:42px;
  }

  main {padding:18px}
  .grid,.attendanceForm {grid-template-columns:1fr}
  .panel {padding:20px}
}

@media(max-width:500px) {
  header {padding:12px}
  header button {font-size:12px}
  .panel {padding:15px}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition:none!important;
    animation:none!important;
  }
}

/* NÂNG CẤP CHUỖI HOẠT ĐỘNG */
.act-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 20px}
.act-entry{padding:18px;border:1px solid #d9e5f1;border-radius:16px;margin:12px 0;background:#fbfdff}
.act-entry .act-entry{margin:10px 0 0;background:white}
.act-entry h3{margin:4px 0 10px;color:#214c7b}
.act-entry p{color:#526982;margin:6px 0}
.act-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act-actions button{min-height:36px;padding:8px 13px;font-size:13px}
.act-subtle{color:#687d93;font-size:13px}
.act-series-child{background:#f7fbff;border:1px solid #d4e3f2;border-radius:14px;padding:18px;margin:16px 0}
.act-series-child h3{margin-top:0}
.act-flex{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.act-check{display:flex;align-items:center;gap:8px;margin:10px 0}
.act-check input{width:18px;min-height:18px;height:18px}
.act-pill{display:inline-block;border-radius:100px;background:#edf5fe;color:#2d608d;padding:3px 10px;font-size:12px;font-weight:bold}
.act-pill.archived{background:#f6e8e8;color:#9f4450}
@media(max-width:640px){.act-form-grid{grid-template-columns:1fr!important}}

/* V8.1: thao tác gọn, công tắc/nhân sự/đợt bầu cử responsive */
.v8-tabs,.v8-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:12px 0 18px}
.v8-tabs button{min-width:108px}
.v8-person-row{display:grid;grid-template-columns:minmax(130px,1fr) auto auto;gap:9px;margin:8px 0;align-items:center}
.v8-show-label{display:flex;gap:5px;align-items:center;font-size:13px;white-space:nowrap}
.v8-show-label input{width:auto;min-height:auto}
.v8-committee-list{margin:10px 0}
.v8-candidate-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:12px 0}
.v8-candidate-pick label{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #e2e8ee;border-radius:10px;background:#fff}
.v8-candidate-pick input{width:auto;min-height:auto}
.v8-tied{background:#fff6df!important;box-shadow:inset 4px 0 #d3a956}
.v8-brief{background:#f7fbfa;border:1px solid #d7e7e2;border-radius:12px;padding:14px;margin:10px 0}
@media(max-width:560px){.v8-person-row{grid-template-columns:1fr auto}.v8-show-label{grid-column:1}.v8-person-row>button{grid-column:2;grid-row:1}.v8-tabs button{min-width:0;flex:1}}


/* V10.3 – BẢNG KIỂM PHIẾU THEO TỪNG ĐỢT */
.kp-v103 .kp-summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.kp-v103 .kp-summary span{border:1px solid #e5eaf2;border-radius:10px;padding:9px 13px;background:#f8fafc;color:#385173;font-weight:650;font-size:13px}
.kp-v103 .kp-round{border:1px solid #e0e8f1;border-radius:14px;background:#fff;margin:14px 0;overflow:hidden;box-shadow:0 3px 13px #1328490d}
.kp-v103 .kp-round[open]{border-color:#d7c093;box-shadow:0 9px 24px #152f4d12}
.kp-v103 .kp-round-title{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 20px;background:#fffdf9}
.kp-v103 .kp-round-title::-webkit-details-marker{display:none}
.kp-v103 .kp-round-title:before{content:'▸';font-size:17px;color:#a58143;flex:none}
.kp-v103 .kp-round[open]>.kp-round-title:before{content:'▾'}
.kp-v103 .kp-round-name{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.kp-v103 .kp-round-name strong{font-size:13px;color:#172b4d}
.kp-v103 .kp-round-name>span{font-size:14px;font-weight:650;color:#566781;overflow-wrap:anywhere}
.kp-v103 .kp-round-metadata{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:9px;font-size:12px;color:#68778a}
.kp-v103 .kp-pill{display:inline-flex;background:#f1f3f6;color:#667085;font-size:11px;font-weight:800;border-radius:99px;padding:6px 10px;white-space:nowrap}
.kp-v103 .kp-pill.is-live{background:#e6f6ed;color:#216e49}
.kp-v103 .kp-round-body{border-top:1px solid #e8edf5;padding:18px 20px 21px}
.kp-v103 .kp-tally{width:100%;min-width:0}
.kp-v103 .kp-tally .scroll{width:100%;overflow-x:auto}
.kp-v103 .kp-note{padding:10px 13px;border-radius:9px;background:#fff7e7;color:#805b24;font-size:12px}
.kp-v103 .kp-publish{border:1px solid #ebedf1;border-radius:12px;margin-top:18px;padding:17px;background:#f9fbfd}
.kp-v103 .kp-publish h3{font-size:17px;margin:0 0 9px;color:#172b4d}
.kp-v103 .kp-publish>p{font-size:13px;color:#68778a;line-height:1.55;margin:0 0 13px}
.kp-v103 .kp-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.kp-v103 label.kp-pick{display:flex;flex-direction:row;gap:9px;align-items:center;border:1px solid #e6ebf2;padding:10px 12px;background:#fff;border-radius:9px;min-height:46px;font-size:12px;cursor:pointer}
.kp-v103 label.kp-pick input,.kp-v103 .kp-visibility input{width:18px;height:18px;min-width:18px;min-height:18px;accent-color:#ae873b;margin:0}
.kp-v103 label.kp-pick span{overflow-wrap:anywhere}
.kp-v103 label.kp-visibility{display:flex;flex-direction:row;gap:10px;align-items:center;margin:16px 0;padding:14px;border:1px solid #e1d2b1;background:#fffdf5;border-radius:10px;font-size:13px;cursor:pointer}
.kp-v103 .kp-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kp-v103 .kp-actions button{white-space:normal}
@media(max-width:720px){.kp-v103 .kp-round-title{align-items:flex-start;padding:14px;flex-wrap:wrap}.kp-v103 .kp-round-metadata{justify-content:flex-start;margin-left:18px}.kp-v103 .kp-round-body{padding:12px}.kp-v103 .kp-publish{padding:13px}.kp-v103 .kp-picks{grid-template-columns:1fr}.kp-v103 .kp-actions button{width:100%}}


/* V15.3 – Cụm xuất danh sách tài khoản */
@media (max-width: 620px) {
  .v15-student-create { grid-template-columns:1fr !important; }
}
/* V17 Admin quick-find controls */
.act-entry[hidden],.reg-series[hidden],.scroll tr[hidden],.nuCard[hidden]{display:none!important}
.v17-search-wrap,.v17-student-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.v17-search-wrap input,.v17-student-filters input{flex:2 1 240px;min-width:0}
.v17-student-filters select{flex:1 1 190px;min-width:0}
.v17-search-count{font-size:12px;color:#60738d}
.v17-student-actions{display:flex;flex-wrap:wrap;gap:5px}

/* V17 exam redesign: scoped to exam view. No changes to other Admin modules. */
.v17ex-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.v17ex-summary>div{background:#f8f8fb;border:1px solid #e9e8ed;border-radius:14px;padding:15px}
.v17ex-summary strong{display:block;font-size:22px;color:#202a45}
.v17ex-summary small{font-size:12px;color:#66738b}
.v17ex-filterrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.v17ex-filterrow input,.v17ex-filterrow select{padding:12px;border:1px solid #dcdfe6;border-radius:10px;min-height:44px;flex:1 1 180px;min-width:0}
.v17ex-cards{display:grid;gap:12px}
.v17ex-card{border:1px solid #e4e3e8;border-radius:16px;padding:18px;background:white;display:flex;align-items:center;gap:14px;min-width:0}
.v17ex-card-main{flex:1;min-width:0}
/* V17 exam card fix: the legacy Admin stylesheet gives every input width:100%.
   This used to stretch the row checkbox across the card and crush the course title
   to a one-character column. Use an explicit 3-column layout and fixed-size pickers. */
.v17ex-cards{min-width:0;min-height:0}
.v17ex-cards .v17ex-card{
  display:grid;
  grid-template-columns:20px minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  min-width:0;
  max-width:100%;
  height:auto;
}
.v17ex-cards .v17ex-card > input[type="checkbox"]{
  width:20px!important;
  min-width:20px!important;
  max-width:20px!important;
  height:20px!important;
  min-height:20px!important;
  margin:0!important;
  padding:0!important;
  flex:none!important;
  justify-self:start;
  align-self:center;
}
.v17ex-card-main{
  flex:none;
  width:auto;
  min-width:0;
  max-width:100%;
  overflow-wrap:break-word;
  word-break:normal;
}
.v17ex-card-main strong,
.v17ex-card-main small{max-width:100%;overflow-wrap:break-word;word-break:normal}
.v17ex-cards .v17ex-actions{
  width:auto;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.v17ex-bulk input[type="checkbox"]{
  width:18px!important;
  min-width:18px!important;
  max-width:18px!important;
  height:18px!important;
  min-height:18px!important;
  margin:0 8px 0 0!important;
  padding:0!important;
  flex:none!important;
  vertical-align:middle;
}
@media(max-width:780px){
 .v17ex-cards .v17ex-card{grid-template-columns:20px minmax(0,1fr);align-items:start;padding:14px;gap:11px}
 .v17ex-cards .v17ex-card > input[type="checkbox"]{margin-top:3px!important;align-self:start}
 .v17ex-cards .v17ex-actions{grid-column:2;width:100%;justify-content:flex-start}
 .v17ex-cards .v17ex-card-main strong{line-height:1.5}
}

.v17ex-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v17ex-menu{position:relative}
.v17ex-menu summary{list-style:none;cursor:pointer;min-width:42px;min-height:42px;display:grid;place-items:center;background:#f7f8fa;border-radius:10px;border:1px solid #e5e7eb;font-size:21px}
.v17ex-menu summary::-webkit-details-marker{display:none}
.v17ex-menu button{min-height:40px;padding:9px 13px;color:#9a2424;white-space:nowrap}

.v17ex-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:12px 0;border-bottom:1px solid #e8e9ed;margin:8px 0 20px}
.v17ex-tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid #e4e4e9;border-radius:10px;background:#fff;color:#526078;padding:11px 14px;font-size:12px;min-height:45px}
.v17ex-tabs button[aria-selected=true]{background:#202d4b;color:#fff;border-color:#202d4b}
.v17ex-panel{display:none;max-width:100%;overflow:hidden}.v17ex-panel.is-active{display:block}
.v17ex-panel h4{font-size:15px;color:#283550;border-bottom:1px solid #eceef1;padding-bottom:10px;margin-top:14px}
.v17ex-intro{background:#faf9f6;padding:16px;border-radius:12px;color:#40516b;line-height:1.7}
.v17rem-builder{border:1px solid #e4e6ed;background:#fff;border-radius:15px;padding:17px;margin:16px 0}
.v17rem-unit{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.v17rem-unit button{border:1px solid #e0e3eb;border-radius:10px;background:#fff;color:#263656;padding:10px 14px;min-height:42px;flex:1 1 65px}
.v17rem-unit button.active{background:#283652;color:white}
.v17rem-controls{display:flex;align-items:center;gap:10px;margin:15px 0}
.v17rem-controls input[type=range]{min-width:0;flex:1;accent-color:#9a6c2a;cursor:pointer}
.v17rem-controls input[type=number]{width:74px;min-height:42px;padding:7px;border:1px solid #dce0e8;border-radius:8px;text-align:center}

.v17rem-presets button{min-height:38px;background:#f8f6f2;color:#6c4e2a;border:1px solid #e8dfd1;border-radius:9px;padding:7px 11px;font-size:12px}
.v17rem-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #ebebed;border-radius:12px;padding:12px;margin:9px 0}
.v17rem-item button{background:#fff;color:#b32929;border:1px solid #eee;border-radius:8px;padding:6px 10px;min-height:34px}
.v17rem-preview{background:#f8f9fb;border-radius:10px;padding:13px;font-size:12px;color:#5a6680;margin:10px 0;line-height:1.6}
.v17ex-danger{color:#ab2d2d!important}.v17ex-shift-editor{display:block;grid-column:1/-1;margin:10px 0}.v17ex-shift-editor .v17ex-card{margin-bottom:10px}.v17ex-shift-editor .v17a-form{margin-bottom:10px}

#v40-dialog{width:min(1050px,96vw);max-height:92vh;overflow:auto;padding:0;color:#22332b;background:#fff;border:1px solid #ccd8d1;border-radius:14px;box-shadow:0 16px 70px #172d2433}#v40-dialog::backdrop{background:#14251b88}#v40-dialog *{box-sizing:border-box}#v40-dialog .v40-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #dce5df;z-index:2}#v40-dialog .v40-wrap{padding:16px;display:grid;gap:12px}#v40-dialog .v40-layout{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:16px}#v40-dialog .v40-nav{display:flex;flex-direction:column;gap:4px;max-height:65vh;overflow:auto}#v40-dialog button{font:inherit;color:#244236;border:1px solid #cedbd3;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}#v40-dialog button:disabled{opacity:.5;cursor:not-allowed}#v40-dialog button.v40-primary,#v40-dialog button[aria-current=true]{color:white;background:#286447;border-color:#286447}#v40-dialog .v40-line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e1e8e3}#v40-dialog .v40-line>div:first-child{flex:1;min-width:0}#v40-dialog small{display:block;color:#52675c;font-size:12px}#v40-dialog .v40-tag{font-size:11px;color:#52675c}#v40-dialog label{display:block;font-weight:600;font-size:13px;color:#22332b}#v40-dialog input:not([type=checkbox]),#v40-dialog textarea,#v40-dialog select{display:block;width:100%;background:#fff;color:#22332b;border:1px solid #cbd8d0;border-radius:7px;padding:8px;margin:5px 0 9px;font:inherit}#v40-dialog textarea{min-height:80px}#v40-dialog .v40-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}#v40-dialog .v40-wide{grid-column:1/-1}#v40-dialog .v40-summary{padding:12px;border:1px solid #dce5df;border-radius:10px;background:#f1f6f3;color:#233a2e;white-space:pre-wrap;overflow-wrap:anywhere}#v40-dialog .v40-phone{background:#243e32;padding:12px;border-radius:12px;color:white} <script>
(()=>{'use strict';const $=id=>document.getElementById(id),make=(tag,t,cls)=>{const e=document.createElement(tag);if(t!==undefined)e.textContent=t;if(cls)e.className=cls;return e;},btn=(t,fn,primary=false)=>{const b=make('button',t,primary?'v40-primary':'');b.type='button';b.onclick=fn;return b;};let dlg,items=[],group='',query='',filter='all',serial=0,dirty=false,armed=false;
const rpc=(cmd,p={})=>new Promise((resolve,reject)=>{if(typeof token==='undefined'||!token)return reject(Error('Vui lòng đăng nhập'));google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).adminV40(token,cmd,p);});
function permitted(){return typeof token!=='undefined'&&!!token&&!String(token).startsWith('deleg_')&&!document.body.classList.contains('fund-treasurer');}
function install(){const nav=$('nav');if(!nav)return;const old=$('v40-nav-button');if(!permitted()){if(old)old.remove();if(dlg?.open){dirty=false;dlg.close();}return;}if(old)return;const b=btn('Thông báo tự động',open);b.id='v40-nav-button';b.style.cssText='display:block;width:100%;text-align:left;margin:8px 0';nav.append(b);}
async function open(){if(!permitted())return;if(!dlg){dlg=make('dialog');dlg.id='v40-dialog';dlg.addEventListener('cancel',e=>{if(dirty&&!confirm('Thoát khi cấu hình chưa lưu?'))e.preventDefault();else dirty=false;});document.body.append(dlg);}dirty=false;dlg.replaceChildren(make('p','Đang tải cấu hình…'));if(!dlg.open)dlg.showModal();try{const r=await rpc('list');items=r.items;armed=r.armed;group=group||'Tổng quan';render();}catch(e){dlg.replaceChildren(make('p',e.message||'Không có quyền truy cập'),btn('Đóng',()=>dlg.close()));}}
function render(){if(!dlg?.open)return;dirty=false;const head=make('div',undefined,'v40-head');head.append(make('h2','Thông báo tự động'),btn('Đóng',()=>{if(!dirty||confirm('Thoát khi chưa lưu?')){dirty=false;dlg.close();}}));const root=make('div',undefined,'v40-wrap');root.append(make('div','V40 Alpha · Mặc định không gửi mới. 4 nhóm nhắc và 3 mẫu tổng hợp có thể chạy thử khi chủ động kích hoạt; quy tắc cũ vẫn giữ cơ chế hiện hành.','v40-summary'));const modules=['Tổng quan',...new Set(items.map(r=>r.module)),'Nhật ký cũ','Nhật ký V40'];const layout=make('div',undefined,'v40-layout'),nav=make('div',undefined,'v40-nav'),main=make('div'),sel=make('select');sel.className='v40-mobile';for(const m of modules){const b=btn(m,()=>{group=m;query='';render();});b.setAttribute('aria-current',String(group===m));nav.append(b);const op=make('option',m);op.value=m;sel.append(op);}sel.value=group;sel.onchange=()=>{group=sel.value;query='';render();};layout.append(nav,main);root.append(sel,layout);dlg.replaceChildren(head,root);const message=make('p','','v40-message');main.append(make('h3',group),message);
 if(group==='Tổng quan'){const n=k=>items.filter(x=>x.kind===k).length;main.append(make('div',`${items.length} mục danh mục\n${n('legacy')} công tắc Push cũ · ${n('preview')} biến thể nhắc có mô phỏng dữ liệu · ${n('digest')} mẫu tổng hợp · ${n('pending')} mục kế hoạch chưa kết nối.`, 'v40-summary'));main.append(make('p',armed?'Đang bật tác vụ thử nghiệm':'Tác vụ thử nghiệm đang tắt'),btn(armed?'Tạm dừng V40':'Kích hoạt thử nghiệm V40',async()=>{if(!confirm(armed?'Dừng các lượt V40 chưa xử lý?':'Chỉ kích hoạt trên môi trường thử nghiệm đã tách dữ liệu. Các quy tắc nhắc được bật có thể gửi thông báo thật tới tài khoản thử nghiệm. Tiếp tục?'))return;try{await rpc(armed?'pause':'arm',{confirm:true});armed=!armed;render();}catch(e){message.textContent=e.message;}}));return;}
 if(group==='Nhật ký V40'){rpc('v40logs').then(r=>{if(!main.isConnected)return;for(const x of r.items)main.append(make('div',new Date(x.created_at).toLocaleString('vi-VN')+' · '+x.adapter+' · '+({CLAIMED:'Đang xử lý hoặc chưa rõ kết quả',SENT:'Đã chuyển OneSignal',PARTIAL:'Đã chuyển một phần',WEB_ONLY:'Đã lưu website',NO_AUDIENCE:'Không có thiết bị',FAILED:'Thất bại',UNKNOWN:'Chưa xác định'}[x.status]||x.status)+'\n'+x.recipient_count+' người · '+x.device_count+' thiết bị','v40-summary'));}).catch(e=>message.textContent=e.message);return;}
 if(group==='Nhật ký cũ'){rpc('logs').then(r=>{if(!main.isConnected)return;for(const x of r.items)main.append(make('div',`${x.time} · ${x.kind} · ${x.status}\n${x.detail}`,'v40-summary'));}).catch(e=>message.textContent=e.message);return;}
 const search=make('input');search.placeholder='Tìm tên hoặc mã quy tắc';search.value=query;const status=make('select');for(const [v,t] of [['all','Tất cả'],['legacy','Đã có công tắc cũ'],['preview','Có mô phỏng'],['digest','Tổng hợp'],['pending','Chưa hỗ trợ']]){const o=make('option',t);o.value=v;status.append(o);}status.value=filter;const results=make('div');main.append(search,status,results);search.oninput=()=>{query=search.value;list();};status.onchange=()=>{filter=status.value;list();};function list(){results.replaceChildren();const matches=items.filter(r=>r.module===group&&(filter==='all'||r.kind===filter)&&(r.label+' '+r.id+' '+r.group).toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));const groups=new Map;for(const r of matches){if(!groups.has(r.group))groups.set(r.group,[]);groups.get(r.group).push(r);}for(const [g,rs] of groups){const d=make('details');d.open=!!query||groups.size===1;d.append(make('summary',g+' ('+rs.length+')'));for(const r of rs){const row=make('div',undefined,'v40-line'),label=make('div');label.append(make('strong',r.label),make('small',r.id+' · '+({legacy:'Push cũ',preview:'Mô phỏng dữ liệu',digest:'Mô phỏng tổng hợp',pending:'Chưa hỗ trợ'}[r.kind])));row.append(label);if(r.kind==='legacy'){const toggle=make('input');toggle.type='checkbox';toggle.checked=r.config.enabled;toggle.setAttribute('aria-label',r.label);toggle.onchange=async()=>{if(!confirm('Thay đổi quy tắc Push cũ đang sử dụng?')){toggle.checked=!toggle.checked;return;}toggle.disabled=true;try{await rpc('legacy',{id:r.id,enabled:toggle.checked});r.config.enabled=toggle.checked;}catch(e){toggle.checked=r.config.enabled;message.textContent=e.message;}finally{toggle.disabled=false;}};row.append(toggle);}else{row.append(btn('Chi tiết',()=>edit(r)));}d.append(row);}results.append(d);}if(!matches.length)results.append(make('p','Không có quy tắc phù hợp.'));}list();}
function edit(r){dirty=false;const c=JSON.parse(JSON.stringify(r.config)),root=make('div',undefined,'v40-wrap'),head=make('div',undefined,'v40-head');head.append(make('h3',r.label),btn('Quay lại',()=>{if(!dirty||confirm('Bỏ thay đổi chưa lưu?'))render();}));dlg.replaceChildren(head,root);const message=make('p','','v40-message');root.append(make('small',r.id+' · '+r.group),make('div',r.kind==='pending'?'Chưa hỗ trợ: lưu bản nháp được, không thể bật gửi.':r.kind==='digest'?'Tổng hợp hằng ngày có thể chạy thử khi kích hoạt V40. Hỗ trợ 4 nguồn; gửi theo lô trong 15 phút.':'Có thể chạy thử trên môi trường staging nếu bật tác vụ V40. Tần suất và mức ưu tiên mới lưu cấu hình, chưa thực thi.','v40-summary'),message);const form=make('div',undefined,'v40-form');root.append(form);
 function field(label,k,type='text',wide=false){const l=make('label',label);if(wide)l.className='v40-wide';const x=make(type==='textarea'?'textarea':'input');if(type!=='textarea')x.type=type;x.value=c[k]??'';x.oninput=()=>{c[k]=type==='number'?Number(x.value):x.value;dirty=true;};l.append(x);form.append(l);}
 function check(label,k,disabled=false){const l=make('label'),x=make('input');x.type='checkbox';x.checked=!!c[k];x.disabled=disabled;x.onchange=()=>{c[k]=x.checked;dirty=true;};l.append(x,document.createTextNode(' '+label));form.append(l);}
 check(['preview','digest'].includes(r.kind)?'Bật quy tắc thử nghiệm':'Bật trong cấu hình mô phỏng', 'enabled',r.kind==='pending');check('Website','web');check('Push','push');field('Tiêu đề website','title','text',true);field(r.kind==='digest'?'Lời mở đầu website (tùy chọn)':'Nội dung website','body','textarea',true);field('Tiêu đề Push riêng','pushTitle','text',true);field(r.kind==='digest'?'Lời mở đầu Push (tùy chọn)':'Nội dung Push riêng','pushBody','textarea',true);if(r.kind==='preview')field('Nhắc trước (phút)','offset','number');field('Giới hạn mỗi ngày (dự kiến, chưa áp dụng)','limit','number');const l=make('label','Mức độ ưu tiên'),p=make('select');for(const [v,t]of [['normal','Thông thường'],['important','Quan trọng'],['urgent','Khẩn cấp'],['low','Trải nghiệm']]){const o=make('option',t);o.value=v;p.append(o);}p.value=c.priority;p.onchange=()=>{c.priority=p.value;dirty=true;};l.append(p);form.append(l);
 if(r.kind==='digest'){field('Giờ gửi dự kiến','time','time');check('Ẩn mục trống','hideEmpty');const d=make('div',undefined,'v40-wide');d.append(make('strong','Mục tổng hợp (thứ tự đã chọn)'));const order=()=>{d.replaceChildren(make('strong','Mục tổng hợp (thứ tự đã chọn)'));for(const s of [...c.sections,...['Hoạt động','Điểm danh','Khảo sát','Bình chọn'].filter(x=>!c.sections.includes(x))]){const row=make('div',undefined,'v40-line'),lab=make('label'),x=make('input');x.type='checkbox';x.checked=c.sections.includes(s);x.onchange=()=>{c.sections=x.checked?[...c.sections,s]:c.sections.filter(y=>y!==s);dirty=true;order();};lab.append(x,document.createTextNode(' '+s));row.append(lab,btn('↑',()=>{const i=c.sections.indexOf(s);if(i>0){[c.sections[i-1],c.sections[i]]=[c.sections[i],c.sections[i-1]];dirty=true;order();}}));d.append(row);}};order();form.append(d);}
 if(r.kind==='preview')root.append(make('small','Biến: {ten_noi_dung}, {gio_dong}, {thoi_gian_con_lai}, {thong_tin_suat}'));const output=make('div'),m=make('input');m.placeholder='MSSV xem tổng hợp (Super Admin)';if(r.kind==='digest')root.append(m);const actions=make('div',undefined,'v40-line');const save=btn('Lưu cấu hình',async()=>{save.disabled=true;try{const res=await rpc('save',{id:r.id,config:c});r.config=res.config;Object.assign(c,res.config);dirty=false;message.textContent='Đã lưu cấu hình.';}catch(e){message.textContent=e.message;}finally{save.disabled=false;}},true);actions.append(save);if(['preview','digest'].includes(r.kind)){const test=btn('Mô phỏng dữ liệu thật',async()=>{test.disabled=true;const t=++serial;output.replaceChildren(make('p','Đang kiểm tra…'));try{const a=await rpc('preview',{id:r.id,config:c,mssv:m.value});if(t!==serial||!output.isConnected)return;output.replaceChildren();for(const w of a.warnings||[])output.append(make('p',w,'v40-message'));if(r.kind==='digest'){output.append(make('h3','Bản tổng hợp website'),make('div',a.title+'\n'+a.body,'v40-summary'),make('h3','Xem trước Push'),phone(a.pushTitle,a.pushBody));}else{for(const x of a.entries||[])output.append(make('div',x.status+' · '+x.due+' · '+x.recipients+' người\n'+x.title+'\n'+x.body,'v40-summary'),phone(x.pushTitle,x.pushBody));if(!a.entries?.length)output.append(make('p','Không có sự kiện đang mở, còn điều kiện và có hạn kết thúc.'));}}catch(e){output.replaceChildren(make('p',e.message,'v40-message'));}finally{test.disabled=false;}});actions.append(test);}root.append(actions,output);}
function phone(t,b){const p=make('div',undefined,'v40-phone');p.append(make('small','LỚP 2505QLNH · Xem trước'),make('div',t+'\n'+b,'v40-summary'));return p;}
